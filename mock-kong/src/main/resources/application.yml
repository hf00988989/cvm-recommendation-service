server:
  port: ${PORT:9090}

spring:
  application:
    name: mock-kong

mock:
  client-id: ${MOCK_CLIENT_ID:demo-client}
  client-secret: ${MOCK_CLIENT_SECRET:demo-secret}
  token-ttl-seconds: ${MOCK_TOKEN_TTL_SECONDS:300}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
